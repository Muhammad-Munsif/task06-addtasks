<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Task Manager</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    :root {
      --primary-color: #4361ee;
      --secondary-color: #3a0ca3;
      --success-color: #4cc9f0;
      --danger-color: #f72585;
      --warning-color: #f8961e;
      --light-color: #f8f9fa;
      --dark-color: #212529;
      --gray-color: #6c757d;
      --border-color: #dee2e6;
      --shadow: 0 4px 12px rgba(0, 0, 0, 0.1);
      --transition: all 0.3s ease;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: var(--dark-color);
    }

    .container {
      background: white;
      border-radius: 20px;
      box-shadow: var(--shadow);
      width: 100%;
      max-width: 800px;
      overflow: hidden;
    }

    /* Header */
    .header {
      background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
      color: white;
      padding: 30px;
      text-align: center;
    }

    .header h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
    }

    .header p {
      opacity: 0.9;
      font-size: 1rem;
    }

    /* Stats Section */
    .stats-section {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
      padding: 20px;
      background: var(--light-color);
      border-bottom: 1px solid var(--border-color);
    }

    .stat-item {
      text-align: center;
      padding: 15px;
      background: white;
      border-radius: 10px;
      box-shadow: var(--shadow);
    }

    .stat-number {
      display: block;
      font-size: 1.8rem;
      font-weight: bold;
      color: var(--primary-color);
    }

    .stat-label {
      font-size: 0.9rem;
      color: var(--gray-color);
      margin-top: 5px;
    }

    /* Filter Section */
    .filter-section {
      padding: 20px;
      background: white;
      border-bottom: 1px solid var(--border-color);
    }

    .filter-controls {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      align-items: center;
    }

    .filter-btn {
      padding: 10px 20px;
      background: var(--light-color);
      border: 2px solid var(--border-color);
      border-radius: 25px;
      cursor: pointer;
      font-weight: 500;
      transition: var(--transition);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .filter-btn.active {
      background: var(--primary-color);
      color: white;
      border-color: var(--primary-color);
    }

    .filter-btn:hover:not(.active) {
      border-color: var(--primary-color);
      color: var(--primary-color);
    }

    /* Input Section */
    .input-section {
      padding: 30px;
      background: white;
    }

    .input-wrapper {
      display: flex;
      gap: 15px;
      margin-bottom: 20px;
    }

    #taskInput {
      flex: 1;
      padding: 15px 20px;
      border: 2px solid var(--border-color);
      border-radius: 10px;
      font-size: 1rem;
      transition: var(--transition);
    }

    #taskInput:focus {
      border-color: var(--primary-color);
      outline: none;
      box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.1);
    }

    .priority-select {
      padding: 0 15px;
      border: 2px solid var(--border-color);
      border-radius: 10px;
      background: white;
      font-size: 1rem;
      cursor: pointer;
    }

    #addTaskBtn {
      padding: 15px 30px;
      background: var(--primary-color);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      align-items: center;
      gap: 10px;
      white-space: nowrap;
    }

    #addTaskBtn:hover {
      background: var(--secondary-color);
      transform: translateY(-2px);
    }

    #addTaskBtn:active {
      transform: translateY(0);
    }

    /* Task List */
    .task-list-section {
      padding: 0 30px 30px;
      max-height: 400px;
      overflow-y: auto;
    }

    .task-list-section::-webkit-scrollbar {
      width: 8px;
    }

    .task-list-section::-webkit-scrollbar-track {
      background: var(--light-color);
      border-radius: 10px;
    }

    .task-list-section::-webkit-scrollbar-thumb {
      background: var(--primary-color);
      border-radius: 10px;
    }

    #taskList {
      list-style: none;
    }

    .task-item {
      background: white;
      border: 2px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 15px;
      transition: var(--transition);
      animation: fadeIn 0.4s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .task-item:hover {
      border-color: var(--primary-color);
      box-shadow: var(--shadow);
      transform: translateY(-2px);
    }

    .task-item.done {
      background: #f8f9fa;
      border-color: #e9ecef;
    }

    .task-checkbox {
      width: 24px;
      height: 24px;
      border: 2px solid var(--border-color);
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition);
      flex-shrink: 0;
    }

    .task-checkbox.checked {
      background: var(--primary-color);
      border-color: var(--primary-color);
    }

    .task-checkbox.checked::after {
      content: '✓';
      color: white;
      font-size: 14px;
      font-weight: bold;
    }

    .task-content {
      flex: 1;
    }

    .task-text {
      font-size: 1.1rem;
      font-weight: 500;
      margin-bottom: 5px;
      color: var(--dark-color);
      word-break: break-word;
    }

    .task-item.done .task-text {
      text-decoration: line-through;
      color: var(--gray-color);
    }

    .task-meta {
      display: flex;
      gap: 15px;
      align-items: center;
      font-size: 0.85rem;
      color: var(--gray-color);
    }

    .task-date {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .task-priority {
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 500;
    }

    .priority-low {
      background: rgba(76, 201, 240, 0.2);
      color: #4cc9f0;
    }

    .priority-medium {
      background: rgba(248, 150, 30, 0.2);
      color: #f8961e;
    }

    .priority-high {
      background: rgba(247, 37, 133, 0.2);
      color: #f72585;
    }

    .task-actions {
      display: flex;
      gap: 10px;
      opacity: 0;
      transition: var(--transition);
    }

    .task-item:hover .task-actions {
      opacity: 1;
    }

    .action-btn {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      border: 2px solid var(--border-color);
      background: white;
      color: var(--gray-color);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition);
    }

    .edit-btn:hover {
      background: var(--primary-color);
      color: white;
      border-color: var(--primary-color);
    }

    .delete-btn:hover {
      background: var(--danger-color);
      color: white;
      border-color: var(--danger-color);
    }

    .star-btn {
      border: none;
      background: transparent;
      color: #ffd700;
      font-size: 1.2rem;
      cursor: pointer;
      transition: var(--transition);
    }

    .star-btn:hover {
      transform: scale(1.2);
    }

    .star-btn.starred {
      color: #ffd700;
    }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--gray-color);
    }

    .empty-state i {
      font-size: 4rem;
      color: #e9ecef;
      margin-bottom: 20px;
      display: block;
    }

    .empty-state h3 {
      font-size: 1.5rem;
      margin-bottom: 10px;
      color: var(--dark-color);
    }

    .empty-state p {
      font-size: 1rem;
    }

    /* Bulk Actions */
    .bulk-actions {
      padding: 20px 30px;
      background: var(--light-color);
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .bulk-select {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .bulk-buttons {
      display: flex;
      gap: 10px;
    }

    .bulk-btn {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .bulk-delete {
      background: var(--danger-color);
      color: white;
    }

    .bulk-complete {
      background: var(--primary-color);
      color: white;
    }

    /* Search */
    .search-box {
      margin: 0 30px 20px;
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 12px 20px 12px 45px;
      border: 2px solid var(--border-color);
      border-radius: 10px;
      font-size: 1rem;
      transition: var(--transition);
    }

    .search-box input:focus {
      border-color: var(--primary-color);
      outline: none;
    }

    .search-box i {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--gray-color);
    }

    /* Responsive Design */
    @media (max-width: 768px) {
      .container {
        max-width: 100%;
        border-radius: 15px;
      }

      .header {
        padding: 25px 20px;
      }

      .header h1 {
        font-size: 2rem;
      }

      .stats-section {
        grid-template-columns: repeat(2, 1fr);
        padding: 15px;
      }

      .input-section,
      .task-list-section,
      .bulk-actions {
        padding: 20px;
      }

      .input-wrapper {
        flex-direction: column;
      }

      #addTaskBtn {
        width: 100%;
        justify-content: center;
      }

      .filter-controls {
        justify-content: center;
      }

      .task-item {
        padding: 15px;
      }

      .task-actions {
        opacity: 1;
      }

      .bulk-actions {
        flex-direction: column;
        gap: 15px;
      }

      .bulk-buttons {
        width: 100%;
        justify-content: center;
      }

      .bulk-btn {
        flex: 1;
        justify-content: center;
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 10px;
      }

      .header h1 {
        font-size: 1.8rem;
      }

      .stats-section {
        grid-template-columns: 1fr;
      }

      .task-item {
        flex-direction: column;
        align-items: flex-start;
        gap: 15px;
      }

      .task-content {
        width: 100%;
      }

      .task-meta {
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
      }

      .task-actions {
        align-self: flex-end;
        margin-top: 10px;
      }

      .search-box {
        margin: 0 20px 15px;
      }
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: white;
      color: var(--dark-color);
      padding: 15px 25px;
      border-radius: 10px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
      display: flex;
      align-items: center;
      gap: 10px;
      transform: translateY(100px);
      opacity: 0;
      transition: var(--transition);
      z-index: 1000;
    }

    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }

    .toast.success {
      border-left: 5px solid var(--primary-color);
    }

    .toast.error {
      border-left: 5px solid var(--danger-color);
    }
  </style>
</head>

<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <h1><i class="fas fa-tasks"></i> Smart Task Manager</h1>
      <p>Organize your tasks efficiently</p>
    </div>

    <!-- Stats -->
    <div class="stats-section">
      <div class="stat-item">
        <span class="stat-number" id="totalTasks">0</span>
        <span class="stat-label">Total Tasks</span>
      </div>
      <div class="stat-item">
        <span class="stat-number" id="completedTasks">0</span>
        <span class="stat-label">Completed</span>
      </div>
      <div class="stat-item">
        <span class="stat-number" id="pendingTasks">0</span>
        <span class="stat-label">Pending</span>
      </div>
      <div class="stat-item">
        <span class="stat-number" id="importantTasks">0</span>
        <span class="stat-label">Important</span>
      </div>
    </div>

    <!-- Filter -->
    <div class="filter-section">
      <div class="filter-controls">
        <button class="filter-btn active" data-filter="all">
          <i class="fas fa-list"></i> All Tasks
        </button>
        <button class="filter-btn" data-filter="pending">
          <i class="fas fa-clock"></i> Pending
        </button>
        <button class="filter-btn" data-filter="completed">
          <i class="fas fa-check-circle"></i> Completed
        </button>
        <button class="filter-btn" data-filter="important">
          <i class="fas fa-star"></i> Important
        </button>
        <button class="filter-btn" data-filter="high">
          <i class="fas fa-exclamation-circle"></i> High Priority
        </button>
      </div>
    </div>

    <!-- Search -->
    <div class="search-box">
      <i class="fas fa-search"></i>
      <input type="text" id="searchInput" placeholder="Search tasks...">
    </div>

    <!-- Input Section -->
    <div class="input-section">
      <div class="input-wrapper">
        <input type="text" id="taskInput" placeholder="What needs to be done?" onkeypress="handleKeyPress(event)">
        <select class="priority-select" id="prioritySelect">
          <option value="low">Low Priority</option>
          <option value="medium" selected>Medium Priority</option>
          <option value="high">High Priority</option>
        </select>
        <button id="addTaskBtn">
          <i class="fas fa-plus"></i> Add Task
        </button>
      </div>
    </div>

    <!-- Task List -->
    <div class="task-list-section">
      <ul id="taskList">
        <!-- Tasks will be added here -->
        <div class="empty-state" id="emptyState">
          <i class="fas fa-clipboard-list"></i>
          <h3>No tasks yet</h3>
          <p>Add your first task to get started!</p>
        </div>
      </ul>
    </div>

    <!-- Bulk Actions -->
    <div class="bulk-actions" id="bulkActions" style="display: none;">
      <div class="bulk-select">
        <input type="checkbox" id="selectAll">
        <label for="selectAll">Select All</label>
      </div>
      <div class="bulk-buttons">
        <button class="bulk-btn bulk-complete" onclick="completeSelected()">
          <i class="fas fa-check"></i> Mark Complete
        </button>
        <button class="bulk-btn bulk-delete" onclick="deleteSelected()">
          <i class="fas fa-trash"></i> Delete Selected
        </button>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div class="toast" id="toast"></div>

  <script>
    // Task Manager
    class TaskManager {
      constructor() {
        this.tasks = JSON.parse(localStorage.getItem('tasks')) || [];
        this.currentFilter = 'all';
        this.searchQuery = '';
        this.selectedTasks = new Set();
        this.init();
      }

      init() {
        this.renderTasks();
        this.setupEventListeners();
        this.updateStats();
      }

      setupEventListeners() {
        // Add task button
        document.getElementById('addTaskBtn').addEventListener('click', () => this.addTask());

        // Filter buttons
        document.querySelectorAll('.filter-btn').forEach(btn => {
          btn.addEventListener('click', (e) => {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');
            this.currentFilter = e.target.dataset.filter;
            this.renderTasks();
          });
        });

        // Search input
        document.getElementById('searchInput').addEventListener('input', (e) => {
          this.searchQuery = e.target.value.toLowerCase();
          this.renderTasks();
        });

        // Select all checkbox
        document.getElementById('selectAll').addEventListener('change', (e) => {
          const checkboxes = document.querySelectorAll('.task-checkbox-select');
          checkboxes.forEach(cb => {
            cb.checked = e.target.checked;
            this.toggleTaskSelection(cb.dataset.id, e.target.checked);
          });
          this.updateBulkActions();
        });

        // Clear completed button
        document.getElementById('clearCompletedBtn')?.addEventListener('click', () => this.clearCompleted());
      }

      addTask() {
        const input = document.getElementById('taskInput');
        const priority = document.getElementById('prioritySelect').value;
        const text = input.value.trim();

        if (!text) {
          this.showToast('Please enter a task!', 'error');
          return;
        }

        const task = {
          id: Date.now(),
          text,
          done: false,
          important: false,
          priority,
          createdAt: new Date().toISOString(),
          updatedAt: new Date().toISOString()
        };

        this.tasks.unshift(task);
        this.saveTasks();
        this.renderTasks();
        this.updateStats();
        this.showToast('Task added successfully!', 'success');

        input.value = '';
        input.focus();
      }

      toggleTask(id) {
        const task = this.tasks.find(t => t.id === id);
        if (task) {
          task.done = !task.done;
          task.updatedAt = new Date().toISOString();
          this.saveTasks();
          this.renderTasks();
          this.updateStats();
          this.showToast(`Task marked as ${task.done ? 'completed' : 'pending'}!`, 'success');
        }
      }

      toggleImportant(id) {
        const task = this.tasks.find(t => t.id === id);
        if (task) {
          task.important = !task.important;
          task.updatedAt = new Date().toISOString();
          this.saveTasks();
          this.renderTasks();
          this.updateStats();
          this.showToast(`Task marked as ${task.important ? 'important' : 'normal'}!`, 'success');
        }
      }

      deleteTask(id) {
        if (confirm('Are you sure you want to delete this task?')) {
          const task = this.tasks.find(t => t.id === id);
          this.tasks = this.tasks.filter(t => t.id !== id);
          this.selectedTasks.delete(id);
          this.saveTasks();
          this.renderTasks();
          this.updateStats();
          this.updateBulkActions();
          this.showToast(`Task "${task.text}" deleted!`, 'success');
        }
      }

      editTask(id) {
        const task = this.tasks.find(t => t.id === id);
        if (!task) return;

        const newText = prompt('Edit task:', task.text);
        if (newText && newText.trim() !== '') {
          task.text = newText.trim();
          task.updatedAt = new Date().toISOString();
          this.saveTasks();
          this.renderTasks();
          this.showToast('Task updated successfully!', 'success');
        }
      }

      toggleTaskSelection(id, checked) {
        if (checked) {
          this.selectedTasks.add(id);
        } else {
          this.selectedTasks.delete(id);
        }
      }

      completeSelected() {
        this.selectedTasks.forEach(id => {
          const task = this.tasks.find(t => t.id === id);
          if (task) task.done = true;
        });
        this.saveTasks();
        this.renderTasks();
        this.updateStats();
        this.selectedTasks.clear();
        this.updateBulkActions();
        this.showToast('Selected tasks completed!', 'success');
      }

      deleteSelected() {
        if (this.selectedTasks.size === 0) return;
        if (!confirm(`Are you sure you want to delete ${this.selectedTasks.size} task(s)?`)) return;

        this.tasks = this.tasks.filter(t => !this.selectedTasks.has(t.id));
        this.selectedTasks.clear();
        this.saveTasks();
        this.renderTasks();
        this.updateStats();
        this.updateBulkActions();
        this.showToast('Selected tasks deleted!', 'success');
      }

      updateBulkActions() {
        const bulkActions = document.getElementById('bulkActions');
        bulkActions.style.display = this.selectedTasks.size > 0 ? 'flex' : 'none';
        document.getElementById('selectAll').checked = this.selectedTasks.size === this.filteredTasks().length;
      }

      filteredTasks() {
        let filtered = this.tasks;

        // Apply search filter
        if (this.searchQuery) {
          filtered = filtered.filter(task =>
            task.text.toLowerCase().includes(this.searchQuery)
          );
        }

        // Apply status filter
        switch (this.currentFilter) {
          case 'pending':
            filtered = filtered.filter(task => !task.done);
            break;
          case 'completed':
            filtered = filtered.filter(task => task.done);
            break;
          case 'important':
            filtered = filtered.filter(task => task.important);
            break;
          case 'high':
            filtered = filtered.filter(task => task.priority === 'high');
            break;
          case 'all':
          default:
            break;
        }

        return filtered;
      }

      renderTasks() {
        const taskList = document.getElementById('taskList');
        const emptyState = document.getElementById('emptyState');
        const filteredTasks = this.filteredTasks();

        if (filteredTasks.length === 0) {
          taskList.innerHTML = '';
          taskList.appendChild(emptyState);
          emptyState.style.display = 'block';
          return;
        }

        emptyState.style.display = 'none';

        taskList.innerHTML = filteredTasks.map(task => `
          <li class="task-item ${task.done ? 'done' : ''}" data-id="${task.id}">
            <div class="task-checkbox ${task.done ? 'checked' : ''}" 
                 onclick="taskManager.toggleTask(${task.id})"></div>
            
            <div class="task-content">
              <div class="task-text">${this.escapeHtml(task.text)}</div>
              <div class="task-meta">
                <span class="task-date">
                  <i class="far fa-calendar"></i> ${this.formatDate(task.updatedAt)}
                </span>
                <span class="task-priority priority-${task.priority}">
                  ${task.priority.charAt(0).toUpperCase() + task.priority.slice(1)} Priority
                </span>
              </div>
            </div>
            
            <div class="task-actions">
              <button class="star-btn ${task.important ? 'starred' : ''}" 
                      onclick="taskManager.toggleImportant(${task.id})">
                <i class="fas fa-star"></i>
              </button>
              <button class="action-btn edit-btn" onclick="taskManager.editTask(${task.id})">
                <i class="fas fa-edit"></i>
              </button>
              <button class="action-btn delete-btn" onclick="taskManager.deleteTask(${task.id})">
                <i class="fas fa-trash"></i>
              </button>
            </div>
          </li>
        `).join('');
      }

      updateStats() {
        const total = this.tasks.length;
        const completed = this.tasks.filter(t => t.done).length;
        const pending = total - completed;
        const important = this.tasks.filter(t => t.important).length;

        document.getElementById('totalTasks').textContent = total;
        document.getElementById('completedTasks').textContent = completed;
        document.getElementById('pendingTasks').textContent = pending;
        document.getElementById('importantTasks').textContent = important;
      }

      saveTasks() {
        localStorage.setItem('tasks', JSON.stringify(this.tasks));
      }

      formatDate(dateString) {
        const date = new Date(dateString);
        const now = new Date();
        const diffMs = now - date;
        const diffMins = Math.floor(diffMs / 60000);
        const diffHours = Math.floor(diffMs / 3600000);
        const diffDays = Math.floor(diffMs / 86400000);

        if (diffMins < 60) {
          return `${diffMins}m ago`;
        } else if (diffHours < 24) {
          return `${diffHours}h ago`;
        } else if (diffDays === 1) {
          return 'Yesterday';
        } else if (diffDays < 7) {
          return `${diffDays}d ago`;
        } else {
          return date.toLocaleDateString('en-US', {
            month: 'short',
            day: 'numeric'
          });
        }
      }

      escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
      }

      showToast(message, type = 'success') {
        const toast = document.getElementById('toast');
        const icon = type === 'success' ? 'fas fa-check-circle' : 'fas fa-exclamation-circle';
        const color = type === 'success' ? '#4361ee' : '#f72585';

        toast.innerHTML = `
          <i class="${icon}" style="color: ${color}"></i>
          <span>${message}</span>
        `;
        toast.className = `toast ${type} show`;

        setTimeout(() => {
          toast.classList.remove('show');
        }, 3000);
      }
    }

    // Global functions
    function handleKeyPress(event) {
      if (event.key === 'Enter') {
        taskManager.addTask();
      }
    }

    // Initialize Task Manager
    const taskManager = new TaskManager();

    // Add sample tasks if empty
    if (taskManager.tasks.length === 0) {
      const sampleTasks = [
        { text: 'Complete project documentation', priority: 'high', important: true },
        { text: 'Buy groceries', priority: 'medium', done: true },
        { text: 'Call mom', priority: 'low' },
        { text: 'Schedule team meeting', priority: 'high', important: true },
        { text: 'Read a book', priority: 'low', done: true }
      ];

      sampleTasks.forEach((task, index) => {
        setTimeout(() => {
          const newTask = {
            id: Date.now() + index,
            text: task.text,
            done: task.done || false,
            important: task.important || false,
            priority: task.priority,
            createdAt: new Date().toISOString(),
            updatedAt: new Date().toISOString()
          };
          taskManager.tasks.push(newTask);
          taskManager.saveTasks();
          taskManager.renderTasks();
          taskManager.updateStats();
        }, index * 200);
      });
    }
  </script>
</body>
</html>
