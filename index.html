<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Task Manager</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

</head>

<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <h1><i class="fas fa-tasks"></i> Smart Task Manager</h1>
      <p>Organize your tasks efficiently</p>
    </div>

    <!-- Stats -->
    <div class="stats-section">
      <div class="stat-item">
        <span class="stat-number" id="totalTasks">0</span>
        <span class="stat-label">Total Tasks</span>
      </div>
      <div class="stat-item">
        <span class="stat-number" id="completedTasks">0</span>
        <span class="stat-label">Completed</span>
      </div>
      <div class="stat-item">
        <span class="stat-number" id="pendingTasks">0</span>
        <span class="stat-label">Pending</span>
      </div>
      <div class="stat-item">
        <span class="stat-number" id="importantTasks">0</span>
        <span class="stat-label">Important</span>
      </div>
    </div>

    <!-- Filter -->
    <div class="filter-section">
      <div class="filter-controls">
        <button class="filter-btn active" data-filter="all">
          <i class="fas fa-list"></i> All Tasks
        </button>
        <button class="filter-btn" data-filter="pending">
          <i class="fas fa-clock"></i> Pending
        </button>
        <button class="filter-btn" data-filter="completed">
          <i class="fas fa-check-circle"></i> Completed
        </button>
        <button class="filter-btn" data-filter="important">
          <i class="fas fa-star"></i> Important
        </button>
        <button class="filter-btn" data-filter="high">
          <i class="fas fa-exclamation-circle"></i> High Priority
        </button>
      </div>
    </div>

    <!-- Search -->
    <div class="search-box">
      <i class="fas fa-search"></i>
      <input type="text" id="searchInput" placeholder="Search tasks...">
    </div>

    <!-- Input Section -->
    <div class="input-section">
      <div class="input-wrapper">
        <input type="text" id="taskInput" placeholder="What needs to be done?" onkeypress="handleKeyPress(event)">
        <select class="priority-select" id="prioritySelect">
          <option value="low">Low Priority</option>
          <option value="medium" selected>Medium Priority</option>
          <option value="high">High Priority</option>
        </select>
        <button id="addTaskBtn">
          <i class="fas fa-plus"></i> Add Task
        </button>
      </div>
    </div>

    <!-- Task List -->
    <div class="task-list-section">
      <ul id="taskList">
        <!-- Tasks will be added here -->
        <div class="empty-state" id="emptyState">
          <i class="fas fa-clipboard-list"></i>
          <h3>No tasks yet</h3>
          <p>Add your first task to get started!</p>
        </div>
      </ul>
    </div>

    <!-- Bulk Actions -->
    <div class="bulk-actions" id="bulkActions" style="display: none;">
      <div class="bulk-select">
        <input type="checkbox" id="selectAll">
        <label for="selectAll">Select All</label>
      </div>
      <div class="bulk-buttons">
        <button class="bulk-btn bulk-complete" onclick="completeSelected()">
          <i class="fas fa-check"></i> Mark Complete
        </button>
        <button class="bulk-btn bulk-delete" onclick="deleteSelected()">
          <i class="fas fa-trash"></i> Delete Selected
        </button>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div class="toast" id="toast"></div>

 
</body>
</html>
